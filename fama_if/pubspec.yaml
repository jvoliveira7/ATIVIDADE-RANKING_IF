name: fama_if
description: "FamaIF - Ranking de Popularidade dos Alunos (PiramidGame IFPR-Pgua)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navegação
  go_router: ^17.1.0

  # Gerência de estado e reatividade
  signals_flutter: ^6.3.0

  # Injeção de dependências
  auto_injector: ^2.1.1

  # Comparação por valor nas entidades
  equatable: ^2.0.8

  # Geração de ids únicos
  uuid: ^4.5.1

  # Formatação de datas
  intl: ^0.20.2

  # Tipografia personalizada
  google_fonts: ^6.2.1

  # Firebase: inicialização, autenticação e banco NoSQL remoto (parte 2)
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # Autenticação com conta Google, integrada ao Firebase Auth
  google_sign_in: ^7.2.0

  # Armazenamento local auxiliar: tema, cache de sessão (nunca dados principais)
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Dublês do Firebase, para testar sem tocar no projeto real
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2

flutter:
  uses-material-design: true